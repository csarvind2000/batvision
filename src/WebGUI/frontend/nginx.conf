server {
    # 5173, not 80: the dev target runs Vite on 5173, and keeping one
    # container port for both means docker-compose.override.yml never has to
    # re-map the published port.
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # NIfTI volumes are large and already gzipped; compress the rest.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 2048m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed assets are immutable; index.html must never be cached or a deploy
    # keeps serving the old bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # a case upload can be hundreds of MB and a review pull nearly as much
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
    }

    # SPA routing: unknown paths fall through to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
